<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YMTEA AR Experience</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // 注册自定义点击跳转组件
    AFRAME.registerComponent('goto-store', {
      init: function () {
        this.el.addEventListener('click', (evt) => {
          window.location.href = 'https://en.ymtea.club';
        });
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <!-- 配置：指定识别目标文件为 targets.mind -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning: #example-scanning-overlay;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    
    <a-assets>
       <!-- 这里可以预加载茶山模型或品牌Logo图片 -->
    </a-assets>
    
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: [clickable]"></a-camera>

    <!-- 当摄像头画面中出现您上传的 Logo 时触发 -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 示例：浮现一个可点击的金色 AR 按钮 -->
      <a-plane 
        position="0 0 0" 
        rotation="0 0 0" 
        width="0.8" 
        height="0.8" 
        color="#D4AF37" 
        clickable 
        goto-store>
        <a-text value="Explore YMTEA" align="center" position="0 -0.1 0.01" color="#000" width="2.5"></a-text>
        <a-text value="Click to Shop" align="center" position="0 -0.25 0.01" color="#333" width="1.8"></a-text>
      </a-plane>

    </a-entity>
  </a-scene>
  <!-- 可选：添加一个正在扫描的提示层 -->
  <div id="example-scanning-overlay" class="hidden">
    <div class="inner">请对准云茗荟 Logo</div>
  </div>
  <style>
    .hidden { display: none; }
    #example-scanning-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.5); color: #FFF; font-size: 20px;
    }
  </style>
</body>
</html>
